<!DOCTYPE html>
<html lang="en">

<!-- HEAD: Website settings, title, fonts and CSS connection -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website browser tab title -->
    <title>FashionHub | Online Shopping</title>

    <!-- Connect external CSS file -->
    <link rel="stylesheet" href="style.css">

    <!-- Import Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<!-- BODY: Everything visible on the website -->
<body>

    <!-- ================================= -->
    <!-- SECTION 1: NAVIGATION BAR         -->
    <!-- Contains logo, menus and search  -->
    <!-- ================================= -->

    <header class="navbar">

        <!-- Website logo -->
        <div class="logo">
            FASHION<span>HUB</span>
        </div>

        <!-- Main navigation links -->
        <nav class="nav-links">
            <a href="#">MEN</a>
            <a href="#">WOMEN</a>
            <a href="#">KIDS</a>
            <a href="#">HOME & LIVING</a>
            <a href="#">BEAUTY</a>
        </nav>

        <!-- Product search bar -->
        <div class="search-box">
            <span>🔍</span>
            <input type="text" placeholder="Search for products, brands and more">
        </div>

        <!-- Profile, wishlist and shopping bag -->
        <div class="nav-icons">
            <div>👤<small>Profile</small></div>
            <div>♡<small>Wishlist</small></div>
            <div>🛍️<small>Bag</small></div>
        </div>

    </header>


    <!-- ================================= -->
    <!-- SECTION 2: HERO BANNER           -->
    <!-- Main promotional banner          -->
    <!-- ================================= -->

    <main>

        <section class="hero">

            <!-- Banner text and shopping button -->
            <div class="hero-content">
                <p>NEW SEASON COLLECTION</p>
                <h1>STYLE THAT<br>DEFINES YOU.</h1>
                <p>Discover the latest fashion trends.</p>
                <button>SHOP NOW →</button>
            </div>

        </section>


        <!-- ================================= -->
        <!-- SECTION 3: SHOP BY CATEGORY       -->
        <!-- Displays product categories      -->
        <!-- ================================= -->

        <section class="categories">

            <h2>SHOP BY CATEGORY</h2>

            <!-- Category cards container -->
            <div class="category-container">

                <div class="category-card">👕<p>Men</p></div>
                <div class="category-card">👗<p>Women</p></div>
                <div class="category-card">👟<p>Footwear</p></div>
                <div class="category-card">👜<p>Accessories</p></div>
                <div class="category-card">⌚<p>Watches</p></div>

            </div>
        </section>

    </main>


    <!-- ================================= -->
    <!-- SECTION 4: JAVASCRIPT CONNECTION -->
    <!-- Adds website functionality       -->
    <!-- ================================= -->

    <script src="script.js"></script>

</body>
</html>
